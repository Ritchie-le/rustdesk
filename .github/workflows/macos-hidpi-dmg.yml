name: Build macOS HiDPI 2K DMG

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/macos-hidpi-dmg.yml"
      - ".github/hidpi/**"

permissions:
  contents: write

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  BRIDGE_RUST_VERSION: "1.75"
  BRIDGE_FLUTTER_VERSION: "3.44.8"
  MAC_RUST_VERSION: "1.81"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VERSION: "1.5.3"
  TARGET_BRANCH: "macos-hidpi-2k"
  RELEASE_TAG: "v1.5.3-hidpi"

jobs:
  prepare-and-bridge:
    name: Apply HiDPI patches & build Flutter bridge
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout fork workflow files
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: fork-meta

      - name: Clone RustDesk 1.5.3 & apply macOS HiDPI 2K + Steady-FPS patches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --branch 1.5.3 --depth 1 --recurse-submodules https://github.com/rustdesk/rustdesk.git work
          pushd work
          BASE_SHA="$(git rev-parse --short HEAD)"
          echo "Checked out upstream 1.5.3 at ${BASE_SHA}"
          python3 ../fork-meta/.github/hidpi/apply_macos_hidpi_changes.py
          git config user.name "Ritchie-le"
          git config user.email "Ritchie-le@users.noreply.github.com"
          git checkout -B "${TARGET_BRANCH}"
          git add -A
          git status --short
          git commit -m "feat(macos): ScreenCaptureKit NV12 capture + 2560x1440 HiDPI cap + steady FPS"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${TARGET_BRANCH}"
          popd

      - name: Install bridge prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain for bridge
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.BRIDGE_RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: work
          prefix-key: bridge-ubuntu-22.04

      - name: Install Flutter for bridge
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.BRIDGE_FLUTTER_VERSION }}
          cache: true

      - name: Generate flutter-rust-bridge (Flutter 3.44)
        working-directory: work
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          bash .github/patches/apply_flutter_3.44_source_patches.sh
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: |
            work/src/bridge_generated.rs
            work/src/bridge_generated.io.rs
            work/flutter/lib/generated_bridge.dart
            work/flutter/lib/generated_bridge.freezed.dart
            work/flutter/macos/Runner/bridge_generated.h
            work/flutter/ios/Runner/bridge_generated.h

  build-macos-arm64-dmg:
    name: Build macOS arm64 DMG (HiDPI 2K)
    needs: [prepare-and-bridge]
    runs-on: macos-15
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout patched macos-hidpi-2k branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          submodules: recursive

      - name: Install build runtime (LLVM, create-dmg, gnu-sed, pkg-config, NASM 2.16.03)
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm create-dmg gnu-sed
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
          wget -q https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
          unzip -q nasm-2.16.03-macosx.zip
          sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
          nasm --version

      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_MACOS_ARM_VERSION }}
          cache: true

      - name: Configure & patch Flutter for macOS arm64
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          flutter config --no-enable-swift-package-manager
          pushd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
          popd
          bash .github/patches/apply_flutter_3.44_source_patches.sh

      - name: Install Rust 1.81 toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: macos-15-hidpi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-flutter-3.44
          path: ./

      - name: Normalize restored bridge layout
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "./work" ]; then
            cp -R ./work/* ./
            rm -rf ./work
          fi
          ls -la ./src/bridge_generated.rs ./flutter/lib/generated_bridge.dart ./flutter/macos/Runner/bridge_generated.h

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-osx)
        shell: bash
        run: |
          set -euo pipefail
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r logf; do
              echo "=== ${logf} ==="
              cat "${logf}"
            done
            exit 1
          fi

      - name: Set MACOSX_DEPLOYMENT_TARGET=12.3 & build RustDesk.app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re
          ver = "12.3"
          for path, pat, repl in [
              ("build.py", r"MACOSX_DEPLOYMENT_TARGET=[0-9]+\.[0-9]+", f"MACOSX_DEPLOYMENT_TARGET={ver}"),
              ("flutter/macos/Podfile", r"platform :osx, '[^']*'", f"platform :osx, '{ver}'"),
              ("Cargo.toml", r'osx_minimum_system_version = "[0-9]+\.[0-9]+"', f'osx_minimum_system_version = "{ver}"'),
              ("flutter/macos/Runner.xcodeproj/project.pbxproj", r"MACOSX_DEPLOYMENT_TARGET = [0-9]+\.[0-9]+;", f"MACOSX_DEPLOYMENT_TARGET = {ver};"),
          ]:
              p = pathlib.Path(path)
              p.write_text(re.sub(pat, repl, p.read_text(encoding="utf-8")), encoding="utf-8")
          PY
          export MACOSX_DEPLOYMENT_TARGET="12.3"
          echo "MACOSX_DEPLOYMENT_TARGET=12.3" >> "$GITHUB_ENV"

          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

          FEATURES="$(./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit --print-features)"
          cargo test --locked --release -p scrap hidpi_4k_modes_cap_cleanly_at_2560x1440
          cargo test --locked --release --lib --features "$FEATURES" retina_hidpi_tests
          cargo test --locked --release --lib --features "$FEATURES" video_send::tests
          cargo test --locked --release --lib --features "$FEATURES" fps_recovery::tests

      - name: Ad-hoc codesign RustDesk.app & package DMG
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
          APP_PATH="./flutter/build/macos/Build/Products/Release/RustDesk.app"
          cat > /tmp/adhoc.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key>
              <false/>
              <key>com.apple.security.cs.allow-jit</key>
              <true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
              <true/>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
              <key>com.apple.security.device.audio-input</key>
              <true/>
              <key>com.apple.security.network.client</key>
              <true/>
              <key>com.apple.security.network.server</key>
              <true/>
          </dict>
          </plist>
          EOF

          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            while IFS= read -r -d '' code; do
              if file -b "$code" | grep -q 'Mach-O'; then
                codesign --force --sign - "$code"
              fi
            done < <(find "$APP_PATH/Contents/Frameworks" -type f -print0)

            while IFS= read -r -d '' framework; do
              codesign --force --sign - "$framework"
            done < <(find "$APP_PATH/Contents/Frameworks" -depth -type d -name '*.framework' -print0)
          fi

          if [ -f "$APP_PATH/Contents/MacOS/service" ]; then
            codesign --force --sign - "$APP_PATH/Contents/MacOS/service"
          fi

          codesign --force --sign - --entitlements /tmp/adhoc.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/g' "$CREATE_DMG"
          DMG_NAME="rustdesk-1.5.3-aarch64-hidpi.dmg"
          rm -f "$DMG_NAME"
          create-dmg \
            --volname "RustDesk HiDPI Installer" \
            --icon "RustDesk.app" 200 190 \
            --hide-extension "RustDesk.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$APP_PATH"
          ls -lh "$DMG_NAME"
          shasum -a 256 "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-1.5.3-aarch64-hidpi-dmg
          path: rustdesk-1.5.3-aarch64-hidpi.dmg
          if-no-files-found: error

      - name: Publish GitHub Release v1.5.3-hidpi
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.TARGET_BRANCH }}
          name: "RustDesk 1.5.3 macOS HiDPI 2K (ScreenCaptureKit NV12 + Steady FPS)"
          prerelease: false
          files: |
            rustdesk-1.5.3-aarch64-hidpi.dmg
